services:
  postgres:
    image: postgres:17-alpine
    container_name: bruno-lava-car-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-lavacar_admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-lavacar_dev_password}
      POSTGRES_DB: ${DATABASE_NAME:-bruno_lava_car}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER:-lavacar_admin} -d ${DATABASE_NAME:-bruno_lava_car}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lava_car_network

  redis:
    image: redis:7-alpine
    container_name: bruno-lava-car-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-lavacar_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lavacar_redis_password}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lava_car_network

  minio:
    image: minio/minio:latest
    container_name: bruno-lava-car-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - lava_car_network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: bruno-lava-car-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    networks:
      - lava_car_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  lava_car_network:
    driver: bridge
