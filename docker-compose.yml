services:
  postgres:
    image: postgres:17-alpine
    container_name: bruno-lava-car-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-lavacar_admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-lavacar_dev_password}
      POSTGRES_DB: ${DATABASE_NAME:-bruno_lava_car}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER:-lavacar_admin} -d ${DATABASE_NAME:-bruno_lava_car}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lava_car_network

  redis:
    image: redis:7-alpine
    container_name: bruno-lava-car-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-lavacar_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lavacar_redis_password}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lava_car_network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: bruno-lava-car-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    networks:
      - lava_car_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bruno-lava-car-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3333}
      API_BASE_URL: ${API_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "${PORT:-3333}:3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lava_car_network

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: bruno-lava-car-npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      DISABLE_IPV6: "true"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - lava_car_network
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  npm_data:
    driver: local
  npm_letsencrypt:
    driver: local

networks:
  lava_car_network:
    driver: bridge
